name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=@libraryhub/web
      - run: npm run typecheck --workspace=@libraryhub/web
      - run: npm run build --workspace=@libraryhub/web

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: libraryhub
          POSTGRES_PASSWORD: libraryhub_dev
          POSTGRES_DB: libraryhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U libraryhub -d libraryhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://libraryhub:libraryhub_dev@localhost:5432/libraryhub
      - run: ruff check app tests
      - run: pytest
        env:
          DATABASE_URL: postgresql+psycopg://libraryhub:libraryhub_dev@localhost:5432/libraryhub
          KOHA_BASE_URL: http://koha.test
          KOHA_CLIENT_ID: test-client-id
          KOHA_CLIENT_SECRET: test-client-secret
          CI: true