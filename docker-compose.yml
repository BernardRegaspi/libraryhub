# Local data services for ULMS development (PostgreSQL + optional Redis).
# Application containers are defined under infrastructure/docker/ when needed.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: libraryhub
      POSTGRES_PASSWORD: libraryhub_dev
      POSTGRES_DB: libraryhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libraryhub -d libraryhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data: